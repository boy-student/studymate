
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>Study Mate | 学習管理サイト</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- =========================
       ログイン・新規登録画面
  ========================== -->
  <section class="auth-screen" id="authScreen">

    <div class="auth-container">

      <!-- アプリロゴ -->
      <div class="app-logo">
        <svg viewBox="0 0 100 100" role="img" aria-label="Study Mate ロゴ">
          <path d="M15 30 Q32 20 50 32 Q68 20 85 30 V77 Q66 68 50 82 Q34 68 15 77 Z"
                fill="none" stroke="white" stroke-width="5"
                stroke-linejoin="round"/>
          <path d="M50 32 V82"
                fill="none" stroke="white" stroke-width="4"/>
          <path d="M63 17 L76 8 L89 17 L87 31 L65 31 Z"
                fill="white"/>
          <path d="M89 17 V35"
                fill="none" stroke="white" stroke-width="3"/>
        </svg>
      </div>

      <!-- アプリ名 -->
      <h1 class="auth-title">
        Study <span>Mate</span>
      </h1>

      <p class="auth-description">
        毎日の勉強を、もっと楽しく。
      </p>

      <p id="authMessage" class="auth-message">
        Study Mateへようこそ！
      </p>

      <!-- メールアドレス・パスワード -->
      <form id="signupForm" class="auth-form">

        <input
          type="email"
          id="email"
          placeholder="メールアドレス"
          autocomplete="email"
          required
        >

        <input
          type="password"
          id="password"
          placeholder="パスワード（6文字以上）"
          minlength="6"
          autocomplete="current-password"
          required
        >

        <button type="button" id="loginButton" class="login-button">
          ログイン
        </button>

        <button type="submit" class="signup-button">
          新規登録
        </button>

      </form>

      <!-- Googleログイン -->
      <button type="button" id="googleLoginButton" class="google-button">
        <span class="google-icon">G</span>
        Googleでログイン
      </button>

      <button type="button" id="logoutButton" hidden>
        ログアウト
      </button>

    </div>
  </section>


  <!-- =========================
       ログイン後の勉強管理画面
  ========================== -->
  <div id="appContent" hidden>

    <header class="header">
      <h1>Study Mate</h1>
      <p>毎日の勉強を、もっと楽しく。</p>

      <button type="button" id="appLogoutButton">
        ログアウト
      </button>
    </header>

    <main class="container">

      <section class="welcome">
        <h2>今日も勉強を頑張ろう！</h2>
        <p>目標を決めて、一歩ずつ進んでいこう。</p>
      </section>

      <!-- 勉強状況 -->
      <section class="stats">

        <div class="stat-card">
          <h3>今日の勉強時間</h3>
          <p id="todayMinutes">0分</p>
        </div>

        <div class="stat-card">
          <h3>今週の勉強時間</h3>
          <p id="weekMinutes">0分</p>
        </div>

        <div class="stat-card">
          <h3>達成率</h3>
          <p id="completionRate">0%</p>
        </div>

      </section>

      <!-- タスク追加 -->
      <section class="task-section">
        <h2>勉強タスクを追加</h2>

        <form id="taskForm">

          <input
            type="text"
            id="taskTitle"
            placeholder="勉強する内容を入力"
            required
          >

          <select id="taskSubject" required>
            <option value="">教科を選択</option>
            <option value="英語">英語</option>
            <option value="数学">数学</option>
            <option value="国語">国語</option>
            <option value="理科">理科</option>
            <option value="社会">社会</option>
            <option value="その他">その他</option>
          </select>

          <input
            type="date"
            id="taskDate"
            required
          >

          <input
            type="number"
            id="taskDuration"
            placeholder="勉強時間（分）"
            min="1"
            required
          >

          <button type="submit">タスクを追加</button>

        </form>
      </section>

      <!-- 勉強リスト -->
      <section class="task-list-section">

        <h2>勉強リスト</h2>

        <div class="filters">
          <button type="button" data-filter="all">すべて</button>
          <button type="button" data-filter="today">今日</button>
          <button type="button" data-filter="upcoming">これから</button>
          <button type="button" data-filter="completed">完了</button>
        </div>

        <div id="taskList">
          <!-- JavaScriptでタスクを表示 -->
        </div>

      </section>

    </main>


      <!-- 友達・タイムライン・記録画面 -->
      <section id="socialArea" class="social-area" hidden>
        <div class="social-top">
          <h2 id="socialTitle">友達</h2>
          <div class="social-actions">
            <button type="button" id="searchFriendButton">友達を検索</button>
            <button type="button" id="addFriendButton">友達追加</button>
          </div>
        </div>

        <div class="social-tabs">
          <button type="button" class="social-tab active" data-social-tab="friends">友達</button>
          <button type="button" class="social-tab" data-social-tab="groups">グループ</button>
        </div>

        <section id="friendsPanel" class="social-panel">
          <h3 id="friendCount">友達</h3>
          <div id="friendList" class="friend-list">
            <p class="empty-state">友達を読み込んでいます...</p>
          </div>
          <section class="request-section">
            <h3>届いている友達申請</h3>
            <div id="incomingRequests" class="friend-list"></div>
          </section>
        </section>

        <section id="groupsPanel" class="social-panel" hidden>
          <p class="empty-state">グループ機能は次の開発ステップで追加する予定です。</p>
        </section>

        <section id="friendProfilePanel" class="social-panel" hidden>
          <button type="button" id="backToFriendsButton" class="back-button">← 友達一覧へ戻る</button>
          <div id="friendProfileContent"></div>
        </section>

        <section id="timelinePanel" class="social-panel" hidden>
          <h3>友達のタイムライン</h3>
          <div id="timelineList" class="timeline-list"></div>
        </section>

        <section id="recordsPanel" class="social-panel" hidden>
          <h3>勉強を報告する</h3>
          <form id="studyReportForm" class="report-form">
            <input id="reportSubject" type="text" placeholder="教科（例：数学）" required>
            <input id="reportMinutes" type="number" min="1" max="1440" placeholder="勉強時間（分）" required>
            <input id="reportComment" type="text" maxlength="120" placeholder="ひとこと（任意）">
            <button type="submit">勉強を報告</button>
          </form>
          <h3>自分の勉強報告</h3>
          <div id="myReportsList" class="timeline-list"></div>
        </section>
      </section>

      <nav id="bottomNavigation" class="bottom-navigation" aria-label="メインナビゲーション">
        <button type="button" class="nav-item active" data-page="friends"><span>♧</span>友達</button>
        <button type="button" class="nav-item" data-page="timeline"><span>◷</span>タイムライン</button>
        <button type="button" class="nav-item" data-page="records"><span>▤</span>記録</button>
        <button type="button" class="nav-item" data-page="home"><span>⌂</span>ホーム</button>
      </nav>

    <footer>
      <p>© 2026 Study Mate</p>
    </footer>

  </div>

  <!-- JavaScript -->
  <script type="module" src="script.js"></script>

</body>
</html>
